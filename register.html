<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-gradient"></div>
    <div class="container glass-card">
        <h2>Register</h2>
        <form id="registrationForm" novalidate>
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" required>
                <span class="error-text" id="fullNameError"></span>
            </div>
            
            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob" required>
                <span class="error-text" id="dobError"></span>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <span class="error-text" id="emailError"></span>
            </div>

            <div class="form-group">
                <label for="phone">Phone (10 digits)</label>
                <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required>
                <span class="error-text" id="phoneError"></span>
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
                <span class="error-text" id="genderError"></span>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" name="address" rows="3" required></textarea>
                <span class="error-text" id="addressError"></span>
            </div>

            <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" name="city" required>
                <span class="error-text" id="cityError"></span>
            </div>

            <div class="form-group">
                <label for="pin">PIN Code (6 digits)</label>
                <input type="text" id="pin" name="pin" pattern="[0-9]{6}" required>
                <span class="error-text" id="pinError"></span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
                <span class="error-text" id="passwordError"></span>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
                <span class="error-text" id="confirmPasswordError"></span>
            </div>

            <button type="submit">Submit</button>
        </form>
        
        <div id="summary" class="summary-card hidden">
            <h3>Registration Successful!</h3>
            <div id="summaryContent"></div>
            <button id="resetForm" type="button">Register Another</button>
        </div>
    </div>
    <script src="validate.js"></script>
</body>
</html>
